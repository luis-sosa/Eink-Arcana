    :root {
      --bg: #ffffff;
      --fg: #000000;
      --accent: #c62828;
      --display: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
      --text: "Spectral", Georgia, "Noto Serif", serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #000000; --fg: #ffffff; --accent: #ef5350; }
    }
    :root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; --accent: #ef5350; }
    html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: inherit; }

    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* One-screen layout: the card takes whatever height is left, so the page never scrolls */
    .wrap {
      height: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
    }


    .draw {
      appearance: none;
      display: block;
      width: 100%;
      min-height: 56px;
      flex: 0 0 auto;
      margin-top: 12px;
      padding: 12px;
      border: 3px solid var(--fg);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--display);
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .draw:active, .draw.holding { border-width: 6px; padding: 9px; }
    .draw, .cardBtn { touch-action: none; -webkit-touch-callout: none; }
    .draw:focus-visible, .cardBtn:focus-visible { outline: 3px dashed var(--fg); outline-offset: 3px; }

    .cardBtn {
      appearance: none;
      display: block;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .cardBtn svg { display: block; width: 100%; height: 100%; }

    /* Card line-art vocabulary: solid strokes, solid fills, and one hatch pattern. No greys, no gradients. */
    .s  { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .t  { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .k  { stroke-width: 4; }
    .f  { fill: var(--fg); stroke: var(--fg); stroke-width: 1.5; stroke-linejoin: round; }
    .w  { fill: var(--bg); stroke: var(--fg); stroke-width: 2.5; stroke-linejoin: round; }
    .h  { fill: url(#hatch); stroke: var(--fg); stroke-width: 2.5; stroke-linejoin: round; }
    .a  { fill: var(--accent); stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; }
    .as { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .bg { fill: var(--bg); stroke: none; }
    .bgs { fill: none; stroke: var(--bg); stroke-width: 3.5; stroke-linecap: round; }
    .chain { stroke-dasharray: 7 5; }
    .ct { font-family: var(--display); font-weight: 700; fill: var(--fg); text-anchor: middle; }
    .inv { fill: var(--bg); }

    .reading { flex: 0 0 auto; margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--fg); }
    .reading h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .reading p { margin: 6px 0 0; font-size: 17px; line-height: 1.4; font-weight: 500; }
    /* Reserve four lines so the card size barely changes between draws */
    #cardDesc { min-height: 5.6em; }
    .reading .keywords { font-size: 15px; font-weight: 700; margin-top: 6px; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="cardBtn" id="cardBtn" type="button" aria-label="Card"></button>
    <section class="reading" aria-live="polite">
      <h2 id="cardName">The deck is ready</h2>
      <p id="cardDesc">Hold the button or the card to shuffle. Let go when it feels right, then turn the card over.</p>
      <p class="keywords" id="cardKeywords"></p>
    </section>
    <button class="draw" id="drawBtn" type="button">Hold to shuffle</button>
  </div>

  <script>
    const deck = [
      { no: "0",     name: "The Fool",           desc: "Starting before you feel ready. A new project, city, or relationship where not knowing the rules is the advantage.", keywords: "fresh start, risk, beginner's mind" },
      { no: "I",     name: "The Magician",       desc: "You already have the tools and the skills. This is about actually shipping: focus turns potential into something real.", keywords: "execution, resourcefulness, intent" },
      { no: "II",    name: "The High Priestess", desc: "Not everything needs to be said yet. Listen for the signal under the noise: gut feelings, patterns, what people leave unsaid.", keywords: "intuition, discretion, hidden information" },
      { no: "III",   name: "The Empress",        desc: "Making things grow by tending rather than forcing. Creative output, care, comfort, and a body that gets what it needs.", keywords: "creativity, nurture, abundance" },
      { no: "IV",    name: "The Emperor",        desc: "Systems, boundaries, and ownership. Building the structure that lets everything else run without you holding it up.", keywords: "structure, authority, boundaries" },
      { no: "V",     name: "The Hierophant",     desc: "Institutions, mentors, and inherited playbooks. Learn the established way, whether to follow it or to know exactly what you're breaking.", keywords: "tradition, mentorship, shared rules" },
      { no: "VI",    name: "The Lovers",         desc: "A choice that shows what you value, about a person, a partnership, or a direction. Alignment over mere attraction.", keywords: "connection, values, commitment" },
      { no: "VII",   name: "The Chariot",        desc: "Forward motion that comes from holding competing drives together instead of letting either one steer.", keywords: "drive, discipline, momentum" },
      { no: "VIII",  name: "Strength",           desc: "Quiet confidence. Handling pressure, difficult people, or your own impulses with patience instead of force.", keywords: "composure, courage, self-control" },
      { no: "IX",    name: "The Hermit",         desc: "Logging off to think. Solitude and deep work, finding your own answer before asking for anyone else's.", keywords: "introspection, focus, independence" },
      { no: "X",     name: "Wheel of Fortune",   desc: "Things are moving, and not all of it is yours to control. Timing, luck, and catching the cycle as it turns.", keywords: "timing, change, luck" },
      { no: "XI",    name: "Justice",            desc: "Cause and effect. Clear-eyed decisions, contracts, and accountability: you get what the facts support.", keywords: "fairness, accountability, consequence" },
      { no: "XII",   name: "The Hanged Man",     desc: "Productive stuckness. Drop the plan for a moment and look at the problem upside down.", keywords: "pause, reframe, letting go" },
      { no: "XIII",  name: "Death",              desc: "An ending that clears space. A job, habit, or version of yourself closes so something else can start. Rarely literal.", keywords: "endings, transition, renewal" },
      { no: "XIV",   name: "Temperance",         desc: "Finding the right mix. Patient iteration, moderation, and blending opposites instead of swinging between extremes.", keywords: "balance, integration, patience" },
      { no: "XV",    name: "The Devil",          desc: "What you're hooked on: habits, feeds, dynamics, comfort zones. Naming the chain is how you notice it was never locked.", keywords: "attachment, compulsion, awareness" },
      { no: "XVI",   name: "The Tower",          desc: "The sudden collapse of something built on a shaky premise. Disruptive at first, clarifying after.", keywords: "upheaval, revelation, reset" },
      { no: "XVII",  name: "The Star",           desc: "Recovery after a hard stretch. Hope that's earned rather than wished for, and a clearer sense of direction.", keywords: "hope, healing, openness" },
      { no: "XVIII", name: "The Moon",           desc: "Things aren't what they seem. Anxiety, ambiguity, and half-information; move carefully and check your assumptions.", keywords: "uncertainty, projection, dreams" },
      { no: "XIX",   name: "The Sun",            desc: "Clarity, energy, things working. Being visibly yourself and getting a good response for it.", keywords: "joy, success, visibility" },
      { no: "XX",    name: "Judgement",          desc: "A wake-up call. Reckon with what came before, hear what you're actually being asked to do, and answer.", keywords: "reckoning, calling, rebirth" },
      { no: "XXI",   name: "The World",          desc: "Completion. A cycle finishes, its lessons settle in, and you're ready for the next, larger loop.", keywords: "completion, integration, arrival" }
    ];

    const P = (d, c = "s") => `<path d="${d}" class="${c}"/>`;
    const C = (x, y, r, c = "s") => `<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
    const E = (x, y, rx, ry, c = "s") => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" class="${c}"/>`;
    const L = (x1, y1, x2, y2, c = "s") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
    const R = (x, y, w, h, c = "s", rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
    const T = (x, y, txt, size, c = "ct") => `<text x="${x}" y="${y}" font-size="${size}" class="${c}">${txt}</text>`;

          leaves += `<path transform="translate(${x} ${y}) rotate(${t + 90})" d="M-8 0 C -4 -6 4 -6 8 0 C 4 6 -4 6 -8 0 Z" class="f"/>`;
        }
        return [
          leaves,
          L(138, 102, 162, 118, "as"), L(138, 118, 162, 102, "as"),
          L(138, 318, 162, 334, "as"), L(138, 334, 162, 318, "as"),
          C(150, 170, 10, "w"),
          P("M150 180 C 140 210 160 240 150 270", "s k"),
          L(150, 270, 145, 310, "s k"), P("M150 270 L166 290 L148 297", "s k"),
          L(150, 194, 126, 180), L(150, 194, 174, 208),
          L(122, 172, 130, 190, "s k"), L(170, 200, 178, 216, "s k"),
          P("M138 184 C 118 220 182 232 160 272", "t"),
          C(58, 98, 20, "w"), C(58, 91, 5, "f"), P("M50 100 q -8 -8 -12 2 M66 100 q 8 -8 12 2"),
          C(242, 98, 20, "w"), P("M228 98 L242 106 L256 98", "s k"), C(242, 95, 4, "f"),
          C(58, 338, 20, "w"), P("M47 333 q 0 -11 10 -7 M69 333 q 0 -11 -10 -7"), C(58, 342, 7, "w"),
          C(242, 338, 20, "w"), S(242, 338, 14, 9, 12, "h"), C(242, 338, 7, "w")
        ];
      }
    ];

    function backArt() {
      let dots = "";
      for (let i = 0; i < 12; i++) {
        const t = rad(i * 30);
        dots += C((150 + 72 * Math.cos(t)).toFixed(1), (217 + 72 * Math.sin(t)).toFixed(1), 3, "f");
      }
      return [
        R(30, 62, 240, 310, "h"),
        [[62, 96], [238, 96], [62, 338], [238, 338]].map(([x, y]) => C(x, y, 16, "w") + S(x, y, 12, 5, 4)).join(""),
        C(150, 217, 84, "w"), C(150, 217, 64), dots,
        S(150, 217, 56, 20, 8, "a"), C(150, 217, 10, "w")
      ];
    }

    const diamond = (x, y, s = 6) => P(`M${x} ${y - s} L${x + s} ${y} L${x} ${y + s} L${x - s} ${y} Z`, "f");

    function cardSVG(top, bottom, artParts, label) {
      const nameSize = bottom.length > 13 ? 17 : 21;
      return `<svg viewBox="0 0 300 460" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" style="fill:var(--bg)"/>
            <line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--fg);stroke-width:2"/>
          </pattern>
          <clipPath id="artclip"><rect x="30" y="62" width="240" height="310"/></clipPath>
        </defs>
        ${R(3, 3, 294, 454, "w", 14)}
        ${R(12, 12, 276, 436, "t", 8)}
        ${diamond(12, 12)}${diamond(288, 12)}${diamond(12, 448)}${diamond(288, 448)}
        ${L(58, 40, 112, 40, "t")}${L(188, 40, 242, 40, "t")}${diamond(58, 40, 4)}${diamond(242, 40, 4)}
        ${T(150, 48, top, 22)}
        <g clip-path="url(#artclip)">${artParts.join("")}</g>
        ${R(30, 62, 240, 310)}
        <text x="150" y="412" font-size="${nameSize}" letter-spacing="1" class="ct">${bottom.toUpperCase()}</text>
        ${diamond(135, 434, 4)}${diamond(150, 434, 4)}${diamond(165, 434, 4)}
      </svg>`;
    }

    const cardBtn = document.getElementById("cardBtn");
    const drawBtn = document.getElementById("drawBtn");
    const nameEl = document.getElementById("cardName");
    const descEl = document.getElementById("cardDesc");
    const kwEl = document.getElementById("cardKeywords");

    const RIFFLE_MS = 220;
    const MIN_RIFFLES = 3;
    const STORE = "tarot-deck-order";

    // The deck keeps its order between sessions, like a physical deck left on the table
    function loadOrder() {
      try {
        const o = JSON.parse(localStorage.getItem(STORE));
        if (Array.isArray(o) && o.length === deck.length && new Set(o).size === deck.length &&
            o.every(n => Number.isInteger(n) && n >= 0 && n < deck.length)) return o;
      } catch (e) {}
      return deck.map((_, i) => i);
    }
    function saveOrder() {
      try { localStorage.setItem(STORE, JSON.stringify(deckOrder)); } catch (e) {}
    }

    // One riffle: cut the deck roughly in half, then drop cards from each half in proportion to its size
    function riffle(order) {
      let cut = 0;
      for (let i = 0; i < order.length; i++) if (Math.random() < 0.5) cut++;
      const a = order.slice(0, cut), b = order.slice(cut), out = [];
      while (a.length || b.length) {
        out.push(Math.random() * (a.length + b.length) < a.length ? a.shift() : b.shift());
      }
      return out;
    }

    const buzz = pattern => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} };

    let deckOrder = loadOrder();
    let state = "idle";
    let timer = null, riffles = 0, revealArmed = false;

    function showBack(label) { cardBtn.innerHTML = cardSVG("✦", label, backArt(), "Card back"); }
    function setReading(name, desc, kw = "") {
      nameEl.textContent = name;
      descEl.textContent = desc;
      kwEl.textContent = kw;
    }

    function startShuffle() {
      if (state === "shuffling") return;
      state = "shuffling";
      riffles = 0;
      revealArmed = false;
      showBack("Shuffling");
      drawBtn.classList.add("holding");
      drawBtn.textContent = "Shuffling…";
      // Only the button label changes while shuffling, so each riffle repaints a small area
      timer = setInterval(() => {
        deckOrder = riffle(deckOrder);
        riffles++;
        drawBtn.textContent = `Shuffling · ${riffles}`;
        buzz(8);
      }, RIFFLE_MS);
    }

    function stopShuffle() {
      if (state !== "shuffling") return;
      clearInterval(timer);
      timer = null;
      drawBtn.classList.remove("holding");
      saveOrder();
      if (riffles < MIN_RIFFLES) {
        state = "idle";
        showBack("Major Arcana");
        drawBtn.textContent = "Hold to shuffle";
        setReading("Keep holding", "Hold a little longer to shuffle, and let go when it feels right.");
        return;
      }
      state = "pulled";
      buzz(25);
      showBack("Tap to turn");
      drawBtn.textContent = "Hold to shuffle again";
      setReading("Card pulled", `You stopped after ${riffles} riffles. Tap the card to turn it over.`);
    }

    function reveal() {
      const i = deckOrder[0];
      const card = deck[i];
      cardBtn.innerHTML = cardSVG(card.no, card.name, art[i](), card.name);
      setReading(card.name, card.desc, card.keywords);
      deckOrder = deckOrder.slice(1).concat(i);
      saveOrder();
      state = "revealed";
      buzz([20, 40, 20]);
      drawBtn.textContent = "Hold to shuffle";
    }

    function bindHold(el, isCard) {
      el.addEventListener("pointerdown", e => {
        if (isCard && state === "pulled") { revealArmed = true; return; }
        if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
        startShuffle();
      });
      const end = () => {
        if (isCard && state === "pulled" && revealArmed) { revealArmed = false; reveal(); return; }
        stopShuffle();
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
      el.addEventListener("contextmenu", e => e.preventDefault());
    }

    bindHold(drawBtn, false);
    bindHold(cardBtn, true);

    drawBtn.addEventListener("keydown", e => {
      if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); startShuffle(); }
    });
    drawBtn.addEventListener("keyup", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); stopShuffle(); }
    });
    cardBtn.addEventListener("keydown", e => {
      if ((e.key === " " || e.key === "Enter") && state === "pulled") { e.preventDefault(); reveal(); }
    });

    showBack("Major Arcana");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
